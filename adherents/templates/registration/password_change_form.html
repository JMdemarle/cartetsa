{% extends "adherents/base.html" %}
{% block titre %}Changer le mot de passe{% endblock %}
{% block content %}
<section class="formulaire">
  <h1>Changer le mot de passe</h1>
  <p>12 caractères minimum. Évitez les mots de passe courants ou déjà utilisés ailleurs.</p>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Enregistrer</button>
  </form>
</section>
{% endblock %}
